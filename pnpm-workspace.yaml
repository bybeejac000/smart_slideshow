# pnpm does not run dependency build scripts by default. This file approves the
# packages that genuinely need them:
#   - electron: postinstall downloads the platform Electron binary
#   - esbuild:  postinstall installs its native binary (used by Vite)
# (libpq was removed alongside the unused pg / pg-native dependencies.)
allowBuilds:
  bufferutil: set this to true or false
  electron: true
  es5-ext: set this to true or false
  esbuild: true
  utf-8-validate: set this to true or false
